# Full feature-combination matrix: every mode × engine × run-style against
# the sample dataset. This workflow owns that test — the "Rust" workflow
# skips it — so the two never run the same work twice.
#
# Triggers on anything that can change how the sample data is transformed
# (the invariants are recomputed from the data itself, so dataset edits are
# validated automatically), plus a manual run from the Actions tab.
name: Feature matrix

on:
  push:
    branches: [ "main" ]
    paths:
      # Sample data/policies, and anything that can change how they are
      # transformed. Engine/policy source counts: a behavior change there is
      # exactly what the matrix exists to catch.
      - "examples/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/feature-matrix.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      # Sample data/policies, and anything that can change how they are
      # transformed. Engine/policy source counts: a behavior change there is
      # exactly what the matrix exists to catch.
      - "examples/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/feature-matrix.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    # Linux only: the feature matrix exercises engine/policy behavior, which
    # is platform-independent, so a second OS would just burn runner minutes
    # (macOS runners bill at a multiple of Linux).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Run feature matrix (mode × engine × single/chain, twice each)
        run: cargo test -p deident-cli --test matrix -- --nocapture
