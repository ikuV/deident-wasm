name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The feature-combination matrix is owned by the "Feature matrix"
      # workflow; skipping it here keeps this gate fast and avoids paying for
      # the same 8 mode × engine × style runs twice.
      - name: Run tests (excluding the feature matrix)
        run: cargo test --workspace -- --skip every_feature_in_every_combination
