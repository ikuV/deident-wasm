[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/core",
    "crates/host",
    "crates/worker",
    "crates/cli",
    "crates/dicom",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"

# Optimize the WebAssembly JIT even in dev/test builds. Wasmtime compiles the
# guest module on every engine construction, and an unoptimized Cranelift made
# that dominate test time (the sandbox tests took ~90s, the feature matrix
# ~130s). These are dependencies we execute but never step through, so there
# is nothing to lose by optimizing them. Costs one slower first build; cached
# afterwards.
[profile.dev.package.wasmtime]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2

[workspace.dependencies]
# crates in this workspace
deident-types = { path = "crates/types" }
# Lean by default so the wasm guest stays small; crates that need Parquet
# (host, cli) opt in with features = ["parquet"].
deident-core = { path = "crates/core", default-features = false }
deident-host = { path = "crates/host" }
deident-dicom = { path = "crates/dicom" }

# external
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSONL column order as it appears in the source data
# (serde_json sorts map keys by default).
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
regex = "1"
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
arrow-array = "59"
arrow-schema = "59"
arrow-cast = "59"
bytes = "1"
dicom-object = "0.10"
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
uuid = { version = "1", features = ["v4"] }
wasmtime = "47"
wasmtime-wasi = "47"

# dev
assert_cmd = "2"
predicates = "3"
tempfile = "3"
