[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/core",
    "crates/host",
    "crates/worker",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
# crates in this workspace
deident-types = { path = "crates/types" }
# Lean by default so the wasm guest stays small; crates that need Parquet
# (host, cli) opt in with features = ["parquet"].
deident-core = { path = "crates/core", default-features = false }
deident-host = { path = "crates/host" }

# external
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSONL column order as it appears in the source data
# (serde_json sorts map keys by default).
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
regex = "1"
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
arrow-array = "59"
arrow-schema = "59"
arrow-cast = "59"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
wasmtime = "47"
wasmtime-wasi = "47"

# dev
assert_cmd = "2"
predicates = "3"
tempfile = "3"
