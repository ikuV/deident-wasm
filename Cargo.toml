[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/core",
    "crates/host",
    "crates/worker",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
# crates in this workspace
deident-types = { path = "crates/types" }
deident-core = { path = "crates/core" }
deident-host = { path = "crates/host" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }

# dev
assert_cmd = "2"
predicates = "3"
tempfile = "3"
