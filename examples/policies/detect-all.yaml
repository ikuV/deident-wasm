# Enable every built-in entity detector with one preset per precision class.
#
#   deident anonymize notes.csv --policy examples/policies/detect-all.yaml --out out.csv --report r.json
#
# The three classes encode how much a match can be trusted:
#
#   precise    Distinctive syntax, mostly checksum-verified — email, IBAN
#              (mod-97), payment card (Luhn), IP, URL, API key, IFSC.
#              Safe to redact automatically.
#   moderate   A recognisable shape that innocent data also has — phone, SSN,
#              date of birth, passport, licence plate. Expect false positives.
#   heuristic  Stand-ins for named entity recognition, which this tool does not
#              have — person name, address, organization, medical term. They
#              produce false positives AND miss real entities, so they default
#              to `detect`: they tell you where to look, they do not clean.
version: 1
dataset: detect-all-demo

key:
  env: DEIDENT_KEY

# Every column must still be classified; patterns are an additional layer, not
# a replacement for classifying your columns.
on_unlisted: error
fields:
  - name: note
    class: utility

presets:
  # Checksum-verified detectors: redact without review.
  - preset: precise
    action: redact

  # Shape-only detectors: redact, but read the report — some matches will be
  # innocent. Use `detect` first on a sample if you are unsure.
  - preset: moderate
    action: redact

  # NER stand-ins: report only. Promoting these to `redact` triggers the
  # `heuristic-pattern-modifies-data` lint, on purpose.
  - preset: heuristic
    action: detect

# An explicit rule always wins over a preset of the same detector name, so you
# can enable a whole class and still tune one member of it.
patterns:
  - name: credit_card
    builtin: credit_card
    action: mock          # keep a Luhn-valid shape for downstream validators
