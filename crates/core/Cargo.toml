[package]
name = "deident-core"
description = "Policies, transforms, job engine and risk reports for the deident privacy transformation engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
deident-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
csv = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
regex = { workspace = true }
parquet = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-cast = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
default = ["parquet"]
# Apache Parquet input/output. Adds the arrow/parquet stack; disable it for
# lean builds (the wasm worker keeps it on — arrow compiles to wasm32-wasip1).
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-cast", "dep:bytes"]

[dev-dependencies]
# Only for file-based integration tests; never compiled into the wasm guest.
tempfile = { workspace = true }
